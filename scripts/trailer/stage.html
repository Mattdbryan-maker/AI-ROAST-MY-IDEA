<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Anton";src:url("../../src/assets/fonts/anton-400.woff")}
@font-face{font-family:"JetBrains Mono";src:url("../../src/assets/fonts/jetbrains-mono-500.woff")}
@font-face{font-family:"Space Grotesk";font-weight:700;src:url("../../src/assets/fonts/space-grotesk-700.woff")}
@font-face{font-family:"Space Grotesk";font-weight:500;src:url("../../src/assets/fonts/space-grotesk-500.woff")}
html,body{margin:0;background:transparent;overflow:hidden}
svg{display:block}
</style></head>
<body>
<svg id="stage" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="characters.js"></script>
<script src="timeline.js"></script>
<script>
Promise.all([
  document.fonts.load('40px "Anton"'),
  document.fonts.load('700 40px "Space Grotesk"'),
  document.fonts.load('500 40px "JetBrains Mono"'),
]).then(()=>document.fonts.ready).then(()=>{
  const s=document.createElement('script'); s.src='scene.js'; s.onload=()=>{window.FONTS_READY=true}; document.body.appendChild(s);
});
</script>
</body></html>
